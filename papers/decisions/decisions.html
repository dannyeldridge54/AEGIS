<title>Danny's Decision Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column of decision cards, open ones first; a desk you clear once a day. */
:root{--bg:#f3f5f4;--panel:#ffffff;--fg:#17201c;--muted:#5d6b64;--line:#d9e0dc;--accent:#2f6f5e;--ok:#2e7d4f;--bad:#b3412f;--later:#8a6d1f;
 --display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111614;--panel:#1a211e;--fg:#e6ece9;--muted:#9aa8a1;--line:#2c3631;--accent:#6fbfa8;--ok:#6cc48f;--bad:#e8826f;--later:#d9b75a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111614;--panel:#1a211e;--fg:#e6ece9;--muted:#9aa8a1;--line:#2c3631;--accent:#6fbfa8;--ok:#6cc48f;--bad:#e8826f;--later:#d9b75a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:700;font-size:1.8rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.count{font-family:var(--display);font-weight:500;color:var(--accent)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.done{opacity:.72}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.kind{text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--accent)}
.title{font-weight:600;font-size:1.02rem;margin:0}
.detail{margin:0;color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
button{font:inherit;font-weight:600;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.yes{border-color:var(--ok);color:var(--ok)} button.no{border-color:var(--bad);color:var(--bad)} button.later{border-color:var(--later);color:var(--later)}
button:disabled{opacity:.5;cursor:default}
.rec{display:inline-block;font-size:.78rem;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--accent);color:var(--accent)}
.status{font-weight:600}.status.approved{color:var(--ok)}.status.rejected{color:var(--bad)}.status.later{color:var(--later)}
textarea{font:inherit;width:100%;box-sizing:border-box;min-height:2.6em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);padding:8px}
.empty,.err{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:20px;color:var(--muted)}
h2{font-family:var(--display);font-weight:500;font-size:1.05rem;margin:8px 0 0;color:var(--muted)}
</style>
<div class="wrap">
  <header>
    <h1>Decision Desk</h1>
    <p class="sub">The loops take the top recommendation on their own and log it here; tap Undo to reopen any of them. Items that can't be undone (publishing, outreach, deleting, money) wait for you. <span class="count" id="count">Loading…</span></p>
  </header>
  <section class="list" id="open" aria-live="polite"><div class="empty">Waiting for the desk to load. New items appear here as the loops add them.</div></section>
  <h2 id="doneHead" hidden>Decided</h2>
  <section class="list" id="done"></section>
</div>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (s) => { try { return new Date(s).toLocaleString([], {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}); } catch (e) { return s || ''; } };
let db = null, rows = [];
function card(d) {
  const c = document.createElement('article'); c.className = 'card' + (d.status === 'open' ? '' : ' done');
  const m = document.createElement('div'); m.className = 'meta';
  const k = document.createElement('span'); k.className = 'kind'; k.textContent = d.kind || 'decision';
  const t = document.createElement('span'); t.textContent = (d.source ? d.source + ' · ' : '') + fmt(d.created);
  m.append(k, t);
  const h = document.createElement('p'); h.className = 'title'; h.textContent = d.title || '(untitled)';
  const p = document.createElement('p'); p.className = 'detail'; p.textContent = d.detail || '';
  c.append(m, h, p);
  if (d.recommend) { const r = document.createElement('p'); r.className = 'detail'; const b0 = document.createElement('span'); b0.className = 'rec'; b0.textContent = 'Recommended: ' + d.recommend; r.appendChild(b0); if (d.why) r.append(document.createTextNode(' ' + d.why)); c.appendChild(r); }
  if (d.status === 'open') {
    const note = document.createElement('textarea'); note.id = 'note-' + d.id; note.placeholder = 'Optional note for Claude'; note.setAttribute('aria-label', 'Note for ' + (d.title || 'this item'));
    const b = document.createElement('div'); b.className = 'btns';
    const opts = Array.isArray(d.options) && d.options.length ? d.options : ['Approve', 'Reject', 'Later'];
    opts.forEach((o) => {
      const btn = document.createElement('button'); btn.textContent = o;
      const low = o.toLowerCase(); btn.className = /approve|yes|go/.test(low) ? 'yes' : /reject|no|stop/.test(low) ? 'no' : /later|wait/.test(low) ? 'later' : '';
      btn.onclick = () => decide(d.id, o, note.value, b);
      b.appendChild(btn);
    });
    c.append(note, b);
  } else {
    const s = document.createElement('p'); s.className = 'detail';
    const st = document.createElement('span'); st.className = 'status ' + (/approve|yes|go/i.test(d.choice || '') ? 'approved' : /reject|no|stop/i.test(d.choice || '') ? 'rejected' : 'later');
    st.textContent = (d.choice || d.status) + (d.decided_by === 'auto' ? ' (auto, top recommendation)' : '') + ' · ' + fmt(d.decided_at);
    s.append(st); if (d.note) s.append(document.createTextNode(' — ' + d.note)); if (d.acted) s.append(document.createTextNode(' · Done: ' + d.acted));
    c.append(s);
    if (d.decided_by === 'auto') { const b = document.createElement('div'); b.className = 'btns'; const u = document.createElement('button'); u.className = 'later'; u.textContent = 'Undo';
      u.onclick = async () => { u.disabled = true; try { await db.collection('decisions').doc(d.id).update({status: 'open', choice: null, decided_by: 'danny-undo', note: 'reopened by Danny', decided_at: new Date().toISOString(), no_auto: true}); } catch (e) { u.disabled = false; } };
      b.appendChild(u); c.appendChild(b); }
  }
  return c;
}
function render() {
  const open = rows.filter((d) => d.status === 'open'), done = rows.filter((d) => d.status !== 'open').sort((a, b) => String(b.decided_at).localeCompare(String(a.decided_at))).slice(0, 15);
  $('count').textContent = open.length ? open.length + (open.length === 1 ? ' item waiting.' : ' items waiting.') : 'Nothing waiting.';
  const o = $('open'); o.replaceChildren();
  if (!open.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'The desk is clear. New items appear here when a loop needs your call.'; o.appendChild(e); }
  open.forEach((d) => o.appendChild(card(d)));
  $('doneHead').hidden = !done.length; const dn = $('done'); dn.replaceChildren(); done.forEach((d) => dn.appendChild(card(d)));
}
async function decide(id, choice, note, box) {
  box.querySelectorAll('button').forEach((x) => x.disabled = true);
  try {
    await db.collection('decisions').doc(id).update({status: /later|wait/i.test(choice) ? 'later' : 'decided', choice, decided_by: 'danny', note: note || '', decided_at: new Date().toISOString()});
  } catch (e) {
    box.querySelectorAll('button').forEach((x) => x.disabled = false);
    const err = document.createElement('p'); err.className = 'detail'; err.textContent = 'Not saved: ' + (e && e.code === 'permission_denied' ? 'only Danny can decide these.' : 'try again in a moment.'); box.after(err);
  }
}
(async () => {
  db = await claude.use('db');
  if (!db) { $('open').innerHTML = ''; const e = document.createElement('div'); e.className = 'err'; e.textContent = 'Sign in to claude.ai to see the desk.'; $('open').appendChild(e); $('count').textContent = ''; return; }
  const timer = setTimeout(() => { if (!rows.length) $('count').textContent = 'Still loading…'; }, 10000);
  db.collection('decisions').onSnapshot((snap) => {
    clearTimeout(timer); rows = snap.docs.map((d) => Object.assign({id: d.id}, d.data())).filter((d) => d.status !== 'later' || true);
    rows.forEach((d) => { if (d.status === 'later') d.status = 'open'; });   // "Later" stays on the desk, at the end
    rows.sort((a, b) => (a.status === 'open' && b.status === 'open') ? String(a.created).localeCompare(String(b.created)) : 0);
    render();
  }, () => { clearTimeout(timer); $('count').textContent = 'Could not load the desk. Reload the page.'; });
})();
</script>
