<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AEGIS Control Panel</title>
<style>
:root{--bg:#07061a;--panel:#0e0c2a;--panel2:#141137;--line:#2a2560;--fg:#e9e6ff;--dim:#a49fd0;
--cyan:#2f8bff;--violet:#7a5cff;--magenta:#d43cff;--pink:#ff6ec7;--sky:#6fb8ff;--red:#ff4d6d;--green:#3ddc97;--blue:#4d7cff;
--est:#3ddc97;--weave:#d43cff;--open:#ffb547;--f-display:"Segoe UI",system-ui,sans-serif;--f-mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-display)}
header{position:sticky;top:0;z-index:5;display:flex;gap:16px;align-items:center;padding:12px 16px;background:rgba(7,6,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font:700 18px var(--f-display);letter-spacing:.14em;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--magenta),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
nav{display:flex;gap:6px;flex-wrap:wrap}nav button{background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:600 13px var(--f-display);cursor:pointer}
nav button[aria-selected=true]{color:var(--fg);border-color:var(--magenta);box-shadow:0 0 0 1px var(--magenta) inset}
main{max-width:1280px;margin:0 auto;padding:16px}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}@media(max-width:900px){.hero{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:16px}
#loom{width:100%;height:440px;border-radius:14px;border:1px solid var(--line);background:radial-gradient(ellipse at center,#120f3a,#05041a);display:block}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 8px}.dim{color:var(--dim)}
.time{display:flex;align-items:center;gap:10px;margin:12px 0}.time input{flex:1;accent-color:var(--magenta)}
.mono{font-family:var(--f-mono);font-size:13px}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.steps button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:6px 10px;font:12px var(--f-mono);cursor:pointer}
.steps button.on{color:var(--fg);border-color:var(--sky)}
.line{display:flex;gap:10px;margin:8px 0}.tag{flex:0 0 auto;font:600 11px var(--f-mono);padding:2px 8px;border-radius:999px;height:fit-content;white-space:nowrap}
.t-established{color:#06281b;background:var(--est)}.t-weave{color:#fff;background:var(--weave)}.t-open{color:#2a1700;background:var(--open)}
.eq{font-family:var(--f-mono);background:#05041a;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;color:var(--sky);overflow-x:auto}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px}
canvas.wave{width:100%;height:120px;display:block;background:#05041a;border-radius:10px;border:1px solid var(--line)}
.waves{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}@media(max-width:900px){.waves{grid-template-columns:1fr}}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:16px}
.tool h3{margin:0 0 6px;font-size:15px}.tool p{margin:4px 0;font-size:13px}.tool .kv{font:12px var(--f-mono);color:var(--dim)}
section[hidden]{display:none}
</style></head>
<body>
<header><div class="brand">AEGIS · CONTROL</div>
<nav role="tablist"><button role="tab" aria-selected="true" data-tab="lesson">SERAPIS: Big Bang → now</button><button role="tab" aria-selected="false" data-tab="tools">Toolkits</button></nav>
<span class="dim mono" style="margin-left:auto">live view · labels: <span style="color:var(--est)">established</span> · <span style="color:var(--weave)">Weave</span> · <span style="color:var(--open)">open</span></span></header>
<main>
<section id="tab-lesson">
 <div class="hero">
  <div><canvas id="loom" aria-label="3D loom: the thread of the Weave from inflation to today"></canvas>
   <div class="time"><span class="mono dim">Big Bang</span><input id="t" type="range" min="0" max="1000" value="20" aria-label="Cosmic time"><span class="mono dim">today → future</span></div>
   <div class="steps" id="steps"></div></div>
  <div class="card" id="lesson" aria-live="polite"></div>
 </div>
 <div class="waves">
  <div class="card"><h2>Primordial ripples P(k)</h2><canvas class="wave" id="w1"></canvas><div class="dim mono">P ∝ k^(n_s−1), n_s 0.9706 · r 5.4e-4</div></div>
  <div class="card"><h2>Inflaton settling at ρ</h2><canvas class="wave" id="w2"></canvas><div class="dim mono">damped oscillation after inflation (illustrative)</div></div>
  <div class="card"><h2>Dark thread w(z)</h2><canvas class="wave" id="w3"></canvas><div class="dim mono">thawing: w ≈ −1 early, w₀ ≈ −0.79 today</div></div>
 </div>
</section>
<section id="tab-tools" hidden><div class="tools" id="toolcards"></div></section>
</main>
<script src="vendor/three.min.js"></script><script src="vendor/OrbitControls.js"></script><script src="vendor/CopyShader.js"></script>
<script src="vendor/LuminosityHighPassShader.js"></script><script src="vendor/EffectComposer.js"></script><script src="vendor/RenderPass.js"></script>
<script src="vendor/ShaderPass.js"></script><script src="vendor/UnrealBloomPass.js"></script>
<script src="panel.js"></script>
</body></html>
