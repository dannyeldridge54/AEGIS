# OpenEvolve config for R(3,10) front L on Danny's PC, using LOCAL Ollama models (no cloud cost).
# Run: python -m openevolve.cli initial_program.py evaluator.py --config config.yaml --iterations 1000
max_iterations: 1000
checkpoint_interval: 25
llm:
  api_base: "http://127.0.0.1:11434/v1"     # Ollama's OpenAI-compatible endpoint
  api_key: "ollama"
  models:
    - name: "REPLACE_WITH_MODEL_A"            # e.g. the model names Danny uses for Janus
      weight: 0.7
    - name: "REPLACE_WITH_MODEL_B"
      weight: 0.3
  temperature: 0.8
  max_tokens: 4096
  timeout: 300
prompt:
  system_message: >
    You are improving a program that constructs a triangle-free graph on 40 vertices whose independence number is as small
    as possible (target <= 9, which would prove the Ramsey number R(3,10) = 41). Known facts: circulants, Cayley graphs on
    all groups of order 40 and 2-block circulants all reach alpha = 10 at best; degrees must lie in 5..9. Try new structures:
    blow-ups, gluing two known extremal pieces, local search with tabu, simulated annealing on alpha, orbit structures.
database:
  population_size: 200
  archive_size: 50
  num_islands: 5          # the swarm: 5 islands evolving in parallel, migrating their best programs
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.6
evaluator:
  timeout: 120
  cascade_evaluation: true
  cascade_thresholds: [0.4]
  parallel_evaluations: 4
diff_based_evolution: true
max_code_length: 20000
