name: tools
on:
  push:
    paths: ["tools/**", "apps/skymap/**", "ufe-v2/aegis/discoveries.py", "ufe-v2/aegis/map_feed.py", "ufe-v2/aegis/community_reviews.py", ".github/workflows/tools.yml"]
  pull_request:
    paths: ["tools/**", "apps/skymap/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # AION's audit needs history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ./tools/aion ./tools/scorecard pytest pyyaml
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: pytest -q tools/aion/tests tools/scorecard/tests tools/tracker/tests apps/skymap/tests/test_export.py
      - run: cd ufe-v2 && python -m pytest -q tests/test_discoveries.py
      - run: aion check --repo .
      - run: python -m pytest -q tools/ladder/tests
      - run: python tools/ladder/ladder.py check
      - run: python tools/tracker/track.py --out /tmp/tracker
