name: tools
on:
  push:
    paths: ["tools/**", "apps/skymap/**", ".github/workflows/tools.yml"]
  pull_request:
    paths: ["tools/**", "apps/skymap/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # AION's audit needs history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ./tools/aion ./tools/scorecard pytest
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: pytest -q tools/aion/tests tools/scorecard/tests tools/tracker/tests apps/skymap/tests/test_export.py
      - run: aion check --repo .
      - run: python tools/tracker/track.py --out /tmp/tracker
