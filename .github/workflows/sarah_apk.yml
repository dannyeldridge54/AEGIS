name: Sarah's Sky APK

on:
  workflow_dispatch:
  push:
    branches: [ unify-bg ]
    paths: [ 'apps/sarah_sky/**' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sarah_sky
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Stage the web app into the APK assets
        run: |
          mkdir -p android/app/src/main/assets/sarah_sky
          cp -r index.html ar.html css js data vendor icons manifest.webmanifest sw.js \
                android/app/src/main/assets/sarah_sky/
          ls android/app/src/main/assets/sarah_sky

      - name: Build debug APK
        working-directory: apps/sarah_sky/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/SarahsSky.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SarahsSky-apk
          path: apps/sarah_sky/out/SarahsSky.apk
          if-no-files-found: error

      - name: Publish APK to the apk-dist branch
        if: github.ref == 'refs/heads/unify-bg'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "sarah-apk-bot"
          git config user.email "noreply@anthropic.com"
          git checkout --orphan apk-dist
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -mindepth 1 ! -name '.git' ! -name 'apps' -exec rm -rf {} + 2>/dev/null || true
          mkdir -p dist
          cp apps/sarah_sky/out/SarahsSky.apk dist/SarahsSky.apk
          rm -rf apps
          git add -f dist/SarahsSky.apk
          git commit -m "APK build ${GITHUB_SHA::7}"
          git push -f origin apk-dist
