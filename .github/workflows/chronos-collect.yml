name: chronos-collect
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chronos
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - name: Run tests
        run: python -m pytest -q scanner/tests research/matter_synthesis research/licensing research/resonance
      - name: Stop after 5 days
        id: window
        run: |
          mkdir -p data/recorded
          [ -f data/recorded/started.txt ] || date -u +%s > data/recorded/started.txt
          start=$(cat data/recorded/started.txt)
          if [ $(( $(date -u +%s) - start )) -gt 432000 ]; then echo "active=no" >> "$GITHUB_OUTPUT"; else echo "active=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Backfill previous data (once)
        if: steps.window.outputs.active == 'yes'
        run: '[ -f data/recorded/backfill_report.json ] || python backfill.py'
      - name: Collect one pass
        if: steps.window.outputs.active == 'yes'
        run: python collect_once.py
      - name: Save data
        if: steps.window.outputs.active == 'yes'
        run: |
          git config user.name "aegis-chronos-bot"
          git config user.email "aegis-chronos-bot@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "collect: snapshot $(date -u +%FT%TZ)"
          git push
