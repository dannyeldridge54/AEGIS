[runtime]
sampler = maxlike
verbosity = quiet

[DEFAULT]
2PT_FILE = likelihood/des-y3/2pt_NG_final_2ptunblind_02_24_21_wnz_covupdate.v2.fits

[maxlike]
method = Nelder-Mead
tolerance = 1e-3
maxiter = 6000
output_ini = /home/claude/aegis/field_tests/S8_WL/part2/../results/part2_ax_spa_lcdm_halofit_axhm_round2_cross_best.ini
max_posterior = T

[output]
filename = /home/claude/aegis/field_tests/S8_WL/part2/../results/part2_ax_spa_lcdm_halofit_axhm_round2_cross.txt
format = text

[pipeline]
modules = camb fast_pt fits_nz source_photoz_bias IA pk_to_cl add_intrinsic 2pt_shear shear_m_bias 2pt_like
values = /home/claude/aegis/field_tests/S8_WL/part2/../results/part2_ax_spa_lcdm_halofit_axhm_round2_cross_values.ini
priors = examples/des-y3-priors.ini
extra_output = cosmological_parameters/sigma_8 data_vector/2pt_chi2
timing = F
debug = F

[consistency]
file = utility/consistency/consistency_interface.py

[camb]
file = /home/claude/aegis/field_tests/S8_WL/part2/load_pk.py
pk_file = /home/claude/aegis/field_tests/S8_WL/part2/../results/pk_ax_spa_lcdm_halofit_axhm.npz
aegis_model = pk
aegis_point = /tmp/claude-0/-home-claude/c19a5ec8-2fdf-518d-a2d4-024b6ab629a5/scratchpad/s8a_run/res_links/cmp_ax_spa_lcdm_halofit_axhm.json
mode = power
lmax = 2500
feedback = 0
AccuracyBoost = 1.1
do_tensors = F
do_lensing = F
NonLinear = pk
halofit_version = takahashi
zmin_background = 0.
zmax_background = 4.
nz_background = 401
kmin = 1e-4
kmax = 50.0
kmax_extrapolate = 500.0
nk = 700

[fits_nz]
file = number_density/load_nz_fits/load_nz_fits.py
nz_file = %(2PT_FILE)s
data_sets = source
prefix_section = T
prefix_extension = T

[source_photoz_bias]
file = number_density/photoz_bias/photoz_bias.py
mode = additive
sample = nz_source
bias_section = wl_photoz_errors
interpolation = linear

[fast_pt]
file = structure/fast_pt/fast_pt_interface.py
do_ia = T
k_res_fac = 0.5
verbose = F

[IA]
file = intrinsic_alignments/tatt/tatt_interface.py
sub_lowk = F
do_galaxy_intrinsic = F
ia_model = tatt

[pk_to_cl]
file = structure/projection/project_2d.py
ell_min_logspaced = 0.1
ell_max_logspaced = 5.0e5
n_ell_logspaced = 100
shear-shear = source-source
shear-intrinsic = source-source
intrinsic-intrinsic = source-source
intrinsicb-intrinsicb = source-source
verbose = F
get_kernel_peaks = F
sig_over_dchi = 20.
shear_kernel_dchi = 10.

[add_intrinsic]
file = shear/add_intrinsic/add_intrinsic.py
shear-shear = T
position-shear = F
perbin = F

[2pt_shear]
file = shear/cl_to_xi_fullsky/cl_to_xi_interface.py
ell_max = 40000
xi_type = EB
theta_file = %(2PT_FILE)s
bin_avg = T
input_section_name = shear_cl shear_cl_bb
output_section_name = shear_xi_plus shear_xi_minus

[shear_m_bias]
file = shear/shear_bias/shear_m_bias.py
m_per_bin = True
cl_section = shear_xi_plus shear_xi_minus
cross_section = galaxy_shear_xi
verbose = F

[2pt_like]
file = likelihood/2pt/2pt_point_mass/2pt_point_mass.py
do_pm_marg = False
include_norm = True
data_file = %(2PT_FILE)s
data_sets = xip xim
make_covariance = F
covmat_name = COVMAT

%include examples/des-y3-scale-cuts.ini
