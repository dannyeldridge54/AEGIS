[DEFAULT]
WnLogPath = /tmp/claude-0/-home-claude/c19a5ec8-2fdf-518d-a2d4-024b6ab629a5/scratchpad/s8a_run/kids/WnLog/
# Path to home directory
my_path = /tmp/claude-0/-home-claude/c19a5ec8-2fdf-518d-a2d4-024b6ab629a5/scratchpad/s8a_run/kids/
# Output path
output_folder = /tmp/claude-0/-home-claude/c19a5ec8-2fdf-518d-a2d4-024b6ab629a5/scratchpad/s8a_run/kids/
# Path to values.ini and priors.ini
config_folder = /home/claude/builds/kids_legacy/KiDS_Legacy_cosmic_shear_data_release/chains_and_config_files/cosebis/
# Path to KiDS-Legacy data
data_folder = /home/claude/builds/kids_legacy/KiDS_Legacy_cosmic_shear_data_release/data/

# External packages

# git clone and install: https://github.com/cosmosis-developers/cosmosis-standard-library
csl_path = /home/claude/builds/csl/
# git clone and install: https://github.com/maricool/2pt_stats
2pt_stats_path = /home/claude/builds/kids_legacy/2pt_stats/
# git clone and install: https://github.com/KiDS-WL/CosmoPowerCosmosis
cosmopowercosmosis_path = /home/claude/builds/kids_legacy/CosmoPowerCosmosis/
# git clone (no install required for running the chain): https://github.com/AngusWright/CosmoPipe
cosmopipe_path = /home/claude/builds/kids_legacy/CosmoPipe/

kcap_path = %(COSMOPIPE_PATH)s/kcap/
data_file = %(DATA_FOLDER)s/KiDS_Legacy_cosebis.fits
stats_name = cosebis
redshift_name = source
sampler_name = maxlike
run_name = %(SAMPLER_NAME)s_%(stats_name)s_Fiducial
tmin_cosebis = 2.00
tmax_cosebis = 300.00
nmax_cosebis = 6
wnlogpath = %(COSMOPIPE_PATH)s/config/cosebis/WnLog/

[pipeline]
modules = correlated_dz_priors load_nz_fits kids_pk extrapolate_power source_photoz_bias correlated_massdep_priors linear_alignment projection mass_dependence_for_ia add_intrinsic cosebis scale_cuts likelihood
values = /tmp/claude-0/-home-claude/c19a5ec8-2fdf-518d-a2d4-024b6ab629a5/scratchpad/s8a_run/kids/part3_ax_spa_lcdm_halofit_union3_axhm_round1_cross_values.ini
priors = %(CONFIG_FOLDER)s/KiDS_Legacy_priors.ini
likelihoods = loglike
extra_output = cosmological_parameters/S_8 cosmological_parameters/sigma_8 cosmological_parameters/A_s cosmological_parameters/omega_m cosmological_parameters/omega_nu cosmological_parameters/omega_lambda cosmological_parameters/cosmomc_theta intrinsic_alignment_parameters/a intrinsic_alignment_parameters/beta intrinsic_alignment_parameters/log10_m_mean_1 intrinsic_alignment_parameters/log10_m_mean_2 intrinsic_alignment_parameters/log10_m_mean_3 intrinsic_alignment_parameters/log10_m_mean_4 intrinsic_alignment_parameters/log10_m_mean_5 intrinsic_alignment_parameters/log10_m_mean_6  nofz_shifts/bias_1 nofz_shifts/bias_2 nofz_shifts/bias_3 nofz_shifts/bias_4 nofz_shifts/bias_5 nofz_shifts/bias_6
verbosity = silent
timing = F
debug = F

[runtime]
sampler = %(SAMPLER_NAME)s

[output]
filename = /tmp/claude-0/-home-claude/c19a5ec8-2fdf-518d-a2d4-024b6ab629a5/scratchpad/s8a_run/kids/part3_ax_spa_lcdm_halofit_union3_axhm_round1_cross.txt
format = text

[cosebis]
file = %(2PT_STATS_PATH)s/cl_to_cosebis/cl_to_cosebis_interface.so
theta_min = %(tmin_cosebis)s
theta_max = %(tmax_cosebis)s
n_max = %(nmax_cosebis)s
roots_n_norms_foldername = %(COSMOPIPE_PATH)s/config/cosebis//TLogsRootsAndNorms/
wn_output_foldername = %(WnLogPath)s
tn_output_foldername = %(2PT_STATS_PATH)s/TpnLog/
output_section_name = cosebis
add_2d_cterm = 0
add_c_term = 0
input_section_name = shear_cl

[scale_cuts]
file = %(KCAP_PATH)s/modules/scale_cuts/scale_cuts.py
output_section_name = scale_cuts_output
data_and_covariance_fits_filename = %(data_file)s
simulate = F
simulate_with_noise = T
mock_filename =
use_stats = En
keep_ang_en = 0.5 6.5
cosebis_extension_name = En
cosebis_section_name = cosebis

[cosmopower]
file = %(COSMOPOWERCOSMOSIS_PATH)s/cosmosis_modules/cosmopower_interface_S8.py
path_2_trained_emulator = %(COSMOPOWERCOSMOSIS_PATH)s/train_emulator_camb_S8/outputs/
use_specific_k_modes = F
kmax = 10.0
kmin = 1e-5
nk = 200

[camb]
file = %(CSL_PATH)s/boltzmann/camb/camb_interface.py
do_reionization = F
mode = background
nonlinear = pk
halofit_version = original
neutrino_hierarchy = normal
kmax = 20.0
zmid = 2.0
nz_mid = 100
zmax = 6.0
nz = 150
zmax_background = 6.0
zmin_background = 0.0
nz_background = 6000

[nautilus]
live_points = 4000
enlarge_per_dim = 1.1
split_threshold = 100
n_networks = 8
n_batch = 720
filepath = %(OUTPUT_FOLDER)s/run_nautilus.hdf5
resume = False
f_live = 0.01
discard_exploration = True
verbose = True
n_eff = 20000

[add_intrinsic]
file = %(CSL_PATH)s/shear/add_intrinsic/add_intrinsic.py
shear-shear = T
position-shear = F
perbin = F

[correlated_dz_priors]
file = %(KCAP_PATH)s/utils/correlated_priors.py
uncorrelated_parameters = nofz_shifts/uncorr_bias_1 nofz_shifts/uncorr_bias_2 nofz_shifts/uncorr_bias_3 nofz_shifts/uncorr_bias_4 nofz_shifts/uncorr_bias_5 nofz_shifts/uncorr_bias_6
output_parameters = nofz_shifts/bias_1 nofz_shifts/bias_2 nofz_shifts/bias_3 nofz_shifts/bias_4 nofz_shifts/bias_5 nofz_shifts/bias_6
covariance = %(DATA_FOLDER)s/Nz_covariance.txt

[correlated_massdep_priors]
file = %(KCAP_PATH)s/utils/correlated_priors.py
uncorrelated_parameters = intrinsic_alignment_parameters/uncorr_a intrinsic_alignment_parameters/uncorr_beta intrinsic_alignment_parameters/uncorr_log10_M_mean_1 intrinsic_alignment_parameters/uncorr_log10_M_mean_2 intrinsic_alignment_parameters/uncorr_log10_M_mean_3 intrinsic_alignment_parameters/uncorr_log10_M_mean_4 intrinsic_alignment_parameters/uncorr_log10_M_mean_5 intrinsic_alignment_parameters/uncorr_log10_M_mean_6
output_parameters = intrinsic_alignment_parameters/a intrinsic_alignment_parameters/beta intrinsic_alignment_parameters/log10_M_mean_1 intrinsic_alignment_parameters/log10_M_mean_2 intrinsic_alignment_parameters/log10_M_mean_3 intrinsic_alignment_parameters/log10_M_mean_4 intrinsic_alignment_parameters/log10_M_mean_5 intrinsic_alignment_parameters/log10_M_mean_6
covariance = %(COSMOPIPE_PATH)s/ia_models/mass_dependent_ia/massdep_cov.txt

[extrapolate_power]
file = %(CSL_PATH)s/boltzmann/extrapolate/extrapolate_power.py
kmax = 500.0

[likelihood]
file = %(KCAP_PATH)s/utils/mini_like.py
input_section_name = scale_cuts_output
like_name = loglike

[linear_alignment]
file = %(CSL_PATH)s/intrinsic_alignments/la_model/linear_alignments_interface.py
method = bk_corrected

[load_nz_fits]
file = %(CSL_PATH)s/number_density/load_nz_fits/load_nz_fits.py
nz_file = %(data_file)s
data_sets = %(redshift_name)s

[mass_dependence_for_ia]
file = %(COSMOPIPE_PATH)s/ia_models/mass_dependent_ia/mass_dependent_ia_model.py

[projection]
file = %(CSL_PATH)s/structure/projection/project_2d.py
ell_min_logspaced = 1.0
ell_max_logspaced = 1.0e5
n_ell_logspaced = 50
position-shear = F
verbose = F
get_kernel_peaks = F
shear-shear = %(redshift_name)s-%(redshift_name)s
shear-intrinsic = %(redshift_name)s-%(redshift_name)s
intrinsic-intrinsic = %(redshift_name)s-%(redshift_name)s

[sample_S8]
file = %(KCAP_PATH)s/utils/sample_S8.py
s8_name = s_8_input
sigma8_name = sigma_8

[source_photoz_bias]
file = %(CSL_PATH)s/number_density/photoz_bias/photoz_bias.py
mode = additive
sample = nz_%(redshift_name)s
bias_section = nofz_shifts
interpolation = cubic
output_deltaz = T
output_section_name = delta_z_out


[kids_pk]
file = /home/claude/aegis/field_tests/S8_WL/kids/kids_pk.py
pk_file = /home/claude/aegis/field_tests/S8_WL/kids/../results/pk_ax_spa_lcdm_halofit_union3_axhm.npz
nonlinear = stored
omega_b = 0.02243697
omega_cdm = 0.11799059
n_s = 0.97278021
w0 = -1.0
wa = 0.0
cache_file = /tmp/claude-0/-home-claude/c19a5ec8-2fdf-518d-a2d4-024b6ab629a5/scratchpad/s8a_run/kids/boost_ax_spa_lcdm_halofit_union3_axhm.npz

[maxlike]
method = Nelder-Mead
tolerance = 1e-3
maxiter = 6000
output_ini = /tmp/claude-0/-home-claude/c19a5ec8-2fdf-518d-a2d4-024b6ab629a5/scratchpad/s8a_run/kids/part3_ax_spa_lcdm_halofit_union3_axhm_round1_cross_best.ini
max_posterior = T
