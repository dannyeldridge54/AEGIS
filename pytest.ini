[pytest]
# Files named *_test.py here are registered study scripts (impact_test.py, exo_test.py, metatron_test.py) that run
# their analysis when executed, not unit tests. Collect only test_*.py so `pytest` does not run them on import.
python_files = test_*.py
# Unit tests live in ufe-v2/tests. cmb-fit/axiclass/nlfix/test_warmstart.py checks the fit pipeline and needs the
# full TWIST environment (AxiCLASS, candl); run it there directly with `$TWIST_PY test_warmstart.py`.
testpaths = ufe-v2/tests
