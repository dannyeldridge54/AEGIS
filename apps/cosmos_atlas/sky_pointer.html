<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AEGIS Sky Pointer</title>
<style>
:root{--bg:#04020b;--fg:#f3eeff;--muted:#a296d8;--acc:#ff6ec7;--red:#ff3d8b;--grn:#4cc3ff;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
body.night{filter:grayscale(1) sepia(1) hue-rotate(-50deg) saturate(5) brightness(.7)}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.bar{position:fixed;left:0;right:0;padding:10px max(12px,env(safe-area-inset-left)) 10px max(12px,env(safe-area-inset-right));display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:rgba(4,7,15,.82)}
.top{top:0;padding-top:max(10px,env(safe-area-inset-top))} .bot{bottom:0;padding-bottom:max(10px,env(safe-area-inset-bottom))}
button,input{font:inherit;color:var(--fg);background:#121a30;border:1px solid #2a3658;border-radius:8px;padding:8px 10px}
button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
input{flex:1;min-width:120px}
#info{font:13px ui-monospace,Menlo,monospace;white-space:pre-wrap;flex-basis:100%}
#guide{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:600 18px system-ui;color:var(--acc);text-align:center;pointer-events:none;text-shadow:0 0 6px #000}
</style></head><body>
<canvas id="c"></canvas>
<div class="bar top"><button id="gps">Use GPS</button><button id="cmp" aria-pressed="false">Point phone</button><button id="nt" aria-pressed="false">Night</button><input id="find" placeholder="Find: Vega, M31, Jupiter…" list="nm"><datalist id="nm"></datalist></div>
<div id="guide"></div>
<div class="bar bot"><div id="info">Tap "Use GPS", then "Point phone" and aim the back of the phone at the sky like a camera. Compass accuracy is about 5 to 10 degrees, so use the chart to finish the last step. Without the compass, drag to look around.</div></div>

  ctx.font=`${12*dpr}px system-ui`; ctx.fillStyle='#ff6ec7'; for(const [n,z] of [['N',0],['E',90],['S',180],['W',270]]){const q=proj(1,z);if(q)ctx.fillText(n,q[0]-4*dpr,q[1]-4*dpr)}
  for(const seg of DATA.lines) path(seg.map(p=>horJ(rot,p[0],p[1],t)),'rgba(170,190,235,.5)',.9);
  ctx.fillStyle='rgba(200,215,245,.75)'; ctx.font=`${11*dpr}px system-ui`; for(const n of DATA.names){const [a,z]=horJ(rot,n[1],n[2],t);const q=proj(a,z);if(q&&a>0)ctx.fillText(n[0],q[0],q[1])}
  for(const s of DATA.stars){const [a,z]=horJ(rot,s[0],s[1],t);if(a<-1)continue;const q=proj(a,z);if(!q)continue;ctx.fillStyle='#eef3ff';ctx.beginPath();ctx.arc(q[0],q[1],Math.max(.7,3.2-s[2]*.55)*dpr,0,7);ctx.fill();if(s[2]<1.6&&!/^HIP/.test(s[3])){ctx.fillStyle='#9fb0d6';ctx.fillText(s[3],q[0]+5*dpr,q[1]-4*dpr)}}
  for(const m of DATA.dso){const [a,z]=horJ(rot,m[0],m[1],t);const q=proj(a,z);if(!q||a<0)continue;ctx.strokeStyle='#2f8bff';ctx.beginPath();ctx.arc(q[0],q[1],3*dpr,0,7);ctx.stroke()}
  for(const n of PL){const [a,z]=bodyHor(n,t,o);const q=proj(a,z);if(!q)continue;ctx.fillStyle=n==='Sun'?'#ffd166':n==='Moon'?'#e9eefc':'#ffb36b';ctx.beginPath();ctx.arc(q[0],q[1],(n==='Sun'||n==='Moon'?7:4)*dpr,0,7);ctx.fill();ctx.fillText(n,q[0]+7*dpr,q[1]-5*dpr)}
  // crosshair
  ctx.strokeStyle='rgba(255,111,111,.85)';ctx.lineWidth=1.2*dpr;const cx=cv.width/2,cy=cv.height/2;for(const r of [0.5,2,4]){const f=Math.min(cv.width,cv.height)/2/Math.tan(view.fov/2*Math.PI/180);ctx.beginPath();ctx.arc(cx,cy,Math.max(3*dpr,Math.tan(r/2*Math.PI/180)*f),0,7);ctx.stroke()}
  let g='';
  if(target){let a,z;if(target.body)[a,z]=bodyHor(target.body,t,o);else [a,z]=horJ(rot,target.ra,target.dec,t);
    const q=proj(a,z); if(q){ctx.strokeStyle='#4cc3ff';ctx.lineWidth=2*dpr;ctx.beginPath();ctx.arc(q[0],q[1],12*dpr,0,7);ctx.stroke()}
    const dz=((z-view.az+540)%360)-180, da=a-view.alt; g=(Math.abs(dz)<1&&Math.abs(da)<1)?'On target ✓':`${dz>0?'→ right':'← left'} ${Math.abs(dz).toFixed(0)}°   ${da>0?'↑ up':'↓ down'} ${Math.abs(da).toFixed(0)}°`;
    $('#info').textContent=`${target.n}: altitude ${a.toFixed(1)}°, azimuth ${z.toFixed(1)}°${a<0?' (below horizon)':''}\nYou: ${lat.toFixed(5)}°, ${lon.toFixed(5)}° · looking alt ${view.alt.toFixed(0)}°, az ${view.az.toFixed(0)}°${compass?' (compass)':''}`}
  else $('#info').textContent=`You: ${lat.toFixed(5)}°, ${lon.toFixed(5)}° · looking alt ${view.alt.toFixed(0)}°, az ${view.az.toFixed(0)}°${compass?' (compass)':' (drag to look around, pinch to zoom)'}`;
  $('#guide').textContent=g; }
// GPS
$('#gps').onclick=()=>{if(!navigator.geolocation){$('#info').textContent='No GPS available in this browser.';return}
  $('#info').textContent='Getting GPS fix…'; navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lon=p.coords.longitude;el=p.coords.altitude||el;try{localStorage.setItem('skyptr',JSON.stringify({lat,lon,el}))}catch(e){};draw()},e=>{$('#info').textContent='GPS failed: '+e.message+' (the page must be opened over https).'},{enableHighAccuracy:true,timeout:20000})};
// compass / tilt
function onOri(e){ let heading=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.absolute&&e.alpha!=null?(360-e.alpha)%360:null); if(heading==null) return;
  // phone held upright facing the sky: beta = tilt (90 = vertical). Screen normal points away from user.
  const beta=e.beta||0; // flat screen-up = 0, upright = 90 (back camera at horizon), overhead = 180 (back camera at zenith)
  view.alt=Math.max(-10,Math.min(90,beta-90));
  view.az=(heading+headingOffset+360)%360; sched() }
$('#cmp').onclick=async()=>{ if(compass){compass=false;removeEventListener('deviceorientationabsolute',onOri);removeEventListener('deviceorientation',onOri);$('#cmp').setAttribute('aria-pressed','false');return}
  try{ if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission(); if(r!=='granted') throw new Error('permission denied')}
    addEventListener('deviceorientationabsolute',onOri); addEventListener('deviceorientation',onOri); compass=true; $('#cmp').setAttribute('aria-pressed','true') }catch(e){$('#info').textContent='Compass not available: '+e.message} };
// drag/zoom
let drag=null; cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,a:view.alt,z:view.az}});
addEventListener('pointerup',()=>drag=null);
cv.addEventListener('pointermove',e=>{if(!drag||compass)return;const k=view.fov/innerHeight;view.az=(drag.z-(e.clientX-drag.x)*k+360)%360;view.alt=Math.max(-10,Math.min(90,drag.a+(e.clientY-drag.y)*k));sched()});
cv.addEventListener('wheel',e=>{e.preventDefault();view.fov=Math.max(5,Math.min(150,view.fov*Math.exp(e.deltaY*.001)));sched()},{passive:false});
let pd=null; cv.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pd){view.fov=Math.max(5,Math.min(150,view.fov*pd/d));sched()}pd=d}},{passive:true}); cv.addEventListener('touchend',()=>pd=null);
// find
const ALL=[...PL.map(n=>({n,body:n})),...DATA.stars.filter(s=>!/^HIP|^HYG/.test(s[3])).map(s=>({n:s[3],ra:s[0],dec:s[1]})),...DATA.dso.map(m=>({n:m[3],ra:m[0],dec:m[1]}))];
$('#nm').innerHTML=ALL.map(o=>`<option value="${o.n.replace(/"/g,'&quot;')}">`).join('');
$('#find').addEventListener('change',()=>{const q=$('#find').value.trim().toLowerCase();target=ALL.find(o=>o.n.toLowerCase()===q)||ALL.find(o=>o.n.toLowerCase().startsWith(q))||null;sched()});
$('#nt').onclick=()=>{const on=!document.body.classList.contains('night');document.body.classList.toggle('night',on);$('#nt').setAttribute('aria-pressed',on)};
let raf=0;function sched(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})}
addEventListener('resize',sched); setInterval(sched,5000); draw();
</script></body></html>
