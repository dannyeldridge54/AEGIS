<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AEGIS Studio</title>
<style>
/* Neon console: one WebGL stage (weave / landscape) + a right rack of knobs, readouts and a scope */
:root{
  --bg:#04020b; --panel:#0b0620; --panel2:#120a2e; --line:#2a1f5a; --fg:#f3eeff; --muted:#a296d8;
  --cyan:#00e5ff; --magenta:#ff2bd6; --lime:#39ff88; --amber:#ff9e00; --violet:#bf5cff; --yellow:#fff200; --red:#ff2e63; --teal:#00ffc8;
  --f-display:"Bahnschrift","Segoe UI Semibold","Segoe UI",system-ui,sans-serif; --f-body:"Segoe UI",system-ui,sans-serif; --f-mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--f-body);overflow:hidden}
[hidden]{display:none!important}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.top{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0b0620,#140838 60%,#0b0620)}
.brand{font:700 20px var(--f-display);letter-spacing:.14em;background:linear-gradient(90deg,var(--cyan),var(--magenta),var(--yellow));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.tabs{display:flex;gap:6px}
.tab{font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.tab[aria-selected=true]{background:var(--magenta);border-color:var(--magenta);color:#14001a;box-shadow:0 0 16px var(--magenta)}
.spacer{flex:1}
.pill{font:500 11px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.live{color:var(--teal);border-color:var(--teal)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.stage{position:relative;min-width:0;min-height:0}
#gl{display:block;width:100%;height:100%}
.hud{position:absolute;left:14px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.hud .lane{font:600 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase}
.stagebar{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.btn:hover{border-color:var(--muted)} .btn:focus-visible,.tab:focus-visible,.knob:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn.pos{color:var(--teal);border-color:var(--teal);box-shadow:0 0 12px rgba(0,255,200,.35)} .btn.neg{color:var(--red);border-color:var(--red);box-shadow:0 0 12px rgba(255,46,99,.35)}
.btn.on{background:var(--violet);border-color:var(--violet);color:#120024}
.btn[disabled]{opacity:.4;cursor:default}
.rack{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;min-height:0}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card h2{margin:0 0 8px;font:600 11px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.knobs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.knob{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:ns-resize;user-select:none;touch-action:none}
.knob svg{width:74px;height:74px;display:block}
.knob .lbl{font:600 10px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.knob .val{font:500 12px var(--f-mono);color:var(--fg)}
.read{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font:500 12px var(--f-mono);align-items:center}
.read b{font:600 18px var(--f-mono);color:var(--cyan)}
.band{position:relative;height:22px;border-radius:6px;background:#0a0418;border:1px solid var(--line);margin-top:6px}
.band i{position:absolute;top:0;bottom:0;border-radius:4px}
.band .mk{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
.small{font:500 11px var(--f-mono);color:var(--muted)}
#scope{width:100%;height:120px;display:block;border-radius:8px;background:#05010f}
#info .t{font:600 14px var(--f-body);color:var(--fg)} #links{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;max-height:220px;overflow:auto}
#links li{border-left:3px solid var(--line);padding-left:8px;font-size:12px} #links li.pos{border-color:var(--teal)} #links li.neg{border-color:var(--red)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">AEGIS STUDIO</div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-weave" aria-selected="true">Weave</button>
      <button class="tab" role="tab" id="t-land" aria-selected="false">Landscape</button>
      <button class="tab" role="tab" id="t-classic" aria-selected="false">Classic views</button>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="engine">engine: offline snapshot</span>
    <span class="pill" id="fps">— fps</span>
  </div>
  <div class="main">
    <div class="stage" id="stage">
      <canvas id="gl" aria-label="AEGIS weave"></canvas>
      <div class="hud" id="hud"></div>
      <div class="stagebar">
        <button class="btn on" id="b3d">3D</button><button class="btn" id="b2d">2D</button>
        <button class="btn pos" id="bplus" disabled>Send +wave</button><button class="btn neg" id="bminus" disabled>Send −wave</button>
        <button class="btn" id="bmode">Resonance mode</button><button class="btn" id="bclear">Calm</button>
      </div>
    </div>
    <aside class="rack">
      <div class="card"><h2>Knobs</h2><div class="knobs" id="knobs"></div></div>
      <div class="card"><h2>SERAPIS-E readout</h2>
        <div class="read"><span>n_s</span><b id="rns">—</b><span>r</span><b id="rr">—</b><span>α_s</span><span id="ra">—</span></div>
        <div class="band" id="bandns" title="CMB-SPA 0.9684±0.0030 (cyan), SPA+DESI 0.9728±0.0027 (magenta)"></div>
        <div class="small" id="rsrc">grid: Janus core on SERAPIS-E</div>
        <div style="display:flex;gap:6px;margin-top:8px"><button class="btn" id="bexact">Compute exact here</button></div>
      </div>
      <div class="card"><h2>Scope · selected node</h2><canvas id="scope" width="640" height="200"></canvas><div class="small" id="scopecap">pick a knob on the weave</div></div>
      <div class="card" id="info"><h2>Node</h2><div class="small">Click a glowing knob on the weave.</div><ul id="links"></ul></div>
    </aside>
  </div>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/CopyShader.js"></script>
<script src="vendor/LuminosityHighPassShader.js"></script>
<script src="vendor/EffectComposer.js"></script>
<script src="vendor/RenderPass.js"></script>
<script src="vendor/ShaderPass.js"></script>
<script src="vendor/UnrealBloomPass.js"></script>
<script src="data.js"></script>
<script src="studio.js"></script>
</body>
</html>
